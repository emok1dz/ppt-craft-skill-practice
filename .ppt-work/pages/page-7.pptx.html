<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.digitalhumanai.top/slidagent/pptx-craft/assets/vendors/tailwind.js"></script>
  <link href="https://cdn.digitalhumanai.top/slidagent/pptx-craft/assets/css/fonts.css" rel="stylesheet">
  <link href="https://cdn.digitalhumanai.top/slidagent/pptx-craft/assets/vendors/fontawesome/css/all.min.css" rel="stylesheet">
  
  <style type="text/tailwindcss">
    @layer utilities {
      .ppt-slide { @apply relative w-[1280px] h-[720px] mx-auto box-border overflow-hidden; }
      .ppt-slide *, .ppt-slide *::before, .ppt-slide *::after { @apply box-border; max-width: 100%; }
      .ppt-slide img, .ppt-slide video, .ppt-slide canvas, .ppt-slide svg,
      .ppt-slide .echarts-main, .ppt-slide .chart-container, .ppt-slide [id*="chart" i] {
        @apply max-w-full max-h-full object-contain;
      }
      .ppt-slide [id*="chart" i], .ppt-slide .chart-container, .ppt-slide .echarts-main {
        width: 100%; height: 100%; min-height: 160px;
      }
      .ppt-slide :has(> [id*="chart" i]), .ppt-slide :has(> .chart-container), .ppt-slide :has(> .echarts-main) {
        min-height: 160px;
      }
      .content-safe { @apply w-[1220px] h-[660px] my-[30px] mx-auto flex flex-col overflow-hidden; }
      .ppt-slide [class*="blur"], .ppt-slide [style*="blur"] { filter: none !important; backdrop-filter: none !important; }
      .ppt-slide [class*="gradient"] { background-image: none !important; }
      .ppt-slide [class*="backdrop-blur"], .ppt-slide [style*="backdrop-filter"] { backdrop-filter: none !important; }
      .ppt-slide { font-family: "WenYuan Sans SC", "Noto Sans SC", sans-serif !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <div class="ppt-slide flex flex-col" type="content">
    <div class="content-safe">
      <header class="h-[60px] flex-shrink-0 flex items-center gap-4">
        <div class="w-[8px] h-[40px]" style="background:#D33941;"></div>
        <h1 class="text-[37px] font-bold text-balance" style="color:#000000;">医护、保险、热身三道保障，让每一场比赛都安心</h1>
      </header>
      <main class="flex-1 min-h-0 flex flex-col gap-4 pt-4">
        <div class="flex gap-4 flex-1">
        <div class="flex-1 p-5 flex flex-col gap-2" style="border:1px solid #DDDDDD;">
          <div class="flex items-center gap-3"><i class="fa-solid fa-kit-medical text-[22px]" style="color:#D33941;"></i>
            <span class="text-[22px] font-bold" style="color:#000000;">现场医护</span></div>
          <p class="text-[19px] leading-[1.5]" style="color:#555757;">校医院医护人员全程驻场，配备急救箱与冰袋</p>
        </div>
        <div class="flex-1 p-5 flex flex-col gap-2" style="border:1px solid #DDDDDD;">
          <div class="flex items-center gap-3"><i class="fa-solid fa-shield-halved text-[22px]" style="color:#D33941;"></i>
            <span class="text-[22px] font-bold" style="color:#000000;">意外保险</span></div>
          <p class="text-[19px] leading-[1.5]" style="color:#555757;">学院为全部参赛队员统一购买赛事意外险</p>
        </div>
        <div class="flex-1 p-5 flex flex-col gap-2" style="border:1px solid #DDDDDD;">
          <div class="flex items-center gap-3"><i class="fa-solid fa-person-running text-[22px]" style="color:#D33941;"></i>
            <span class="text-[22px] font-bold" style="color:#000000;">赛前热身</span></div>
          <p class="text-[19px] leading-[1.5]" style="color:#555757;">每场赛前预留 10 分钟热身，裁判检查护具与鞋袜</p>
        </div>
        </div>
        <div class="flex gap-4 flex-1">
        <div class="flex-1 p-5 flex flex-col gap-2" style="border:1px solid #DDDDDD;">
          <div class="flex items-center gap-3"><i class="fa-solid fa-user-check text-[22px]" style="color:#D33941;"></i>
            <span class="text-[22px] font-bold" style="color:#000000;">健康承诺</span></div>
          <p class="text-[19px] leading-[1.5]" style="color:#555757;">参赛前签署健康承诺书，有心脏等疾病史者不宜上场</p>
        </div>
        <div class="flex-1 p-5 flex flex-col gap-2" style="border:1px solid #DDDDDD;">
          <div class="flex items-center gap-3"><i class="fa-solid fa-flag text-[22px]" style="color:#D33941;"></i>
            <span class="text-[22px] font-bold" style="color:#000000;">专业裁判</span></div>
          <p class="text-[19px] leading-[1.5]" style="color:#555757;">邀请体育学院裁判协会执裁，保证判罚公正</p>
        </div>
        </div>
      </main>
      <footer class="h-[30px] flex-shrink-0 flex justify-between items-center text-[12px]" style="color:#898989;">
        <span>来源：本次迎新杯活动策划方案</span><span>2026 级新生篮球迎新杯 · 宣传</span>
      </footer>
    </div>
  </div>
</body>
</html>
