<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.digitalhumanai.top/slidagent/pptx-craft/assets/vendors/tailwind.js"></script>
  <link href="https://cdn.digitalhumanai.top/slidagent/pptx-craft/assets/css/fonts.css" rel="stylesheet">
  <link href="https://cdn.digitalhumanai.top/slidagent/pptx-craft/assets/vendors/fontawesome/css/all.min.css" rel="stylesheet">
  
  <style type="text/tailwindcss">
    @layer utilities {
      .ppt-slide { @apply relative w-[1280px] h-[720px] mx-auto box-border overflow-hidden; }
      .ppt-slide *, .ppt-slide *::before, .ppt-slide *::after { @apply box-border; max-width: 100%; }
      .ppt-slide img, .ppt-slide video, .ppt-slide canvas, .ppt-slide svg,
      .ppt-slide .echarts-main, .ppt-slide .chart-container, .ppt-slide [id*="chart" i] {
        @apply max-w-full max-h-full object-contain;
      }
      .ppt-slide [id*="chart" i], .ppt-slide .chart-container, .ppt-slide .echarts-main {
        width: 100%; height: 100%; min-height: 160px;
      }
      .ppt-slide :has(> [id*="chart" i]), .ppt-slide :has(> .chart-container), .ppt-slide :has(> .echarts-main) {
        min-height: 160px;
      }
      .content-safe { @apply w-[1220px] h-[660px] my-[30px] mx-auto flex flex-col overflow-hidden; }
      .ppt-slide [class*="blur"], .ppt-slide [style*="blur"] { filter: none !important; backdrop-filter: none !important; }
      .ppt-slide [class*="gradient"] { background-image: none !important; }
      .ppt-slide [class*="backdrop-blur"], .ppt-slide [style*="backdrop-filter"] { backdrop-filter: none !important; }
      .ppt-slide { font-family: "WenYuan Sans SC", "Noto Sans SC", sans-serif !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <div class="ppt-slide flex flex-col" type="content">
    <div class="content-safe">
      <header class="h-[60px] flex-shrink-0 flex items-center gap-4">
        <div class="w-[8px] h-[40px]" style="background:#D33941;"></div>
        <h1 class="text-[37px] font-bold text-balance" style="color:#000000;">迎新杯在 5 天内用 32 场比赛串起 16 个新生班级</h1>
      </header>
      <main class="flex-1 min-h-0 flex flex-col gap-4 pt-4">
        <div class="flex gap-4">
        <div class="flex-1 p-5 flex flex-col items-start gap-1" style="border:1px solid #DDDDDD;">
          <div><span class="text-[48px] font-bold" style="color:#D33941;font-family:Arial;">16</span><span class="text-[21px] font-bold ml-1" style="color:#000000;">支</span></div>
          <span class="text-[16px]" style="color:#555757;">参赛队伍（每个新生班级 1 支）</span>
        </div>
        <div class="flex-1 p-5 flex flex-col items-start gap-1" style="border:1px solid #DDDDDD;">
          <div><span class="text-[48px] font-bold" style="color:#D33941;font-family:Arial;">32</span><span class="text-[21px] font-bold ml-1" style="color:#000000;">场</span></div>
          <span class="text-[16px]" style="color:#555757;">全部比赛场次</span>
        </div>
        <div class="flex-1 p-5 flex flex-col items-start gap-1" style="border:1px solid #DDDDDD;">
          <div><span class="text-[48px] font-bold" style="color:#D33941;font-family:Arial;">5</span><span class="text-[21px] font-bold ml-1" style="color:#000000;">天</span></div>
          <span class="text-[16px]" style="color:#555757;">比赛日（10 月 12 日—16 日）</span>
        </div>
        <div class="flex-1 p-5 flex flex-col items-start gap-1" style="border:1px solid #DDDDDD;">
          <div><span class="text-[48px] font-bold" style="color:#D33941;font-family:Arial;">3</span><span class="text-[21px] font-bold ml-1" style="color:#000000;">块</span></div>
          <span class="text-[16px]" style="color:#555757;">同时使用的室内标准场地</span>
        </div>
        </div>
        <div class="flex gap-4 flex-1">
        <div class="flex-1 p-5 flex flex-col gap-2" style="border:1px solid #DDDDDD;">
          <div class="flex items-center gap-3"><i class="fa-solid fa-location-dot text-[22px]" style="color:#D33941;"></i>
            <span class="text-[22px] font-bold" style="color:#000000;">比赛地点</span></div>
          <p class="text-[19px] leading-[1.5]" style="color:#555757;">学校体育馆一层，3 块场地同时开赛，看台对全体师生开放</p>
        </div>
        <div class="flex-1 p-5 flex flex-col gap-2" style="border:1px solid #DDDDDD;">
          <div class="flex items-center gap-3"><i class="fa-solid fa-users text-[22px]" style="color:#D33941;"></i>
            <span class="text-[22px] font-bold" style="color:#000000;">参赛对象</span></div>
          <p class="text-[19px] leading-[1.5]" style="color:#555757;">计算机学院 2026 级全体新生，以班级为单位组队</p>
        </div>
        <div class="flex-1 p-5 flex flex-col gap-2" style="border:1px solid #DDDDDD;">
          <div class="flex items-center gap-3"><i class="fa-solid fa-handshake text-[22px]" style="color:#D33941;"></i>
            <span class="text-[22px] font-bold" style="color:#000000;">活动目的</span></div>
          <p class="text-[19px] leading-[1.5]" style="color:#555757;">以赛促融，帮助新生在开学第一个月结识同学、融入集体</p>
        </div>
        </div>
      </main>
      <footer class="h-[30px] flex-shrink-0 flex justify-between items-center text-[12px]" style="color:#898989;">
        <span>来源：本次迎新杯活动策划方案</span><span>2026 级新生篮球迎新杯 · 宣传</span>
      </footer>
    </div>
  </div>
</body>
</html>
